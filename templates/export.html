{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5>导出每周人社资讯</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">资讯标题:</label>
                    <input type="text" id="reportTitle" class="form-control" value="每周人社资讯">
                </div>
                
                <div class="mb-3">
                    <h6>生成的内容预览:</h6>
                    <div id="contentPreview" class="border p-3 bg-light">
                        <div class="text-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="d-flex gap-2" style="display: flex; justify-content: space-between; align-items: center;">
                    <button id="back2indexBtn" class="btn btn-secondary" style="margin-right: auto;">
                        <i class="bi bi-arrow-left"></i> 返回重新选择
                    </button>
                    <button id="exportWordBtn" class="btn btn-primary" style="">
                        <i class="bi bi-file-earmark-word"></i> 导出Word文档
                    </button>
                    <button id="exportPdfBtn" class="btn btn-danger" style="">
                        <i class="bi bi-file-earmark-pdf"></i> 导出PDF
                    </button>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/export.js"></script>
{% endblock %}
