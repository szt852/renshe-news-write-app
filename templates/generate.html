{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5>生成人社资讯内容</h5>
                <p class="mb-0">当前生成: <span class="badge bg-primary" id="currentCategory"></span></p>

            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">选择模型:</label>
                    <select id="modelSelect" class="form-select">
                        <option value="qwen3">Qwen3 (本地)</option>
                        <option value="deepseek">DeepSeek (云端)</option>
                    </select>
                </div>

                <div class="mb-3" id="apiKeyBox" style="display: none;">
                    <label class="form-label">DeepSeek API Key:</label>
                    <div class="input-group">
                        <input type="password" id="userApiKey" class="form-control" placeholder="请输入您的 DeepSeek API Key">
                        <button class="btn btn-outline-secondary" type="button" id="toggleApiKeyBtn">
                            <i class="bi bi-eye"></i>
                        </button>
                        <button class="btn btn-outline-success" type="button" id="saveApiKeyBtn">
                            <i class="bi bi-save"></i> 保存
                        </button>
                    </div>
                    <div class="d-flex justify-content-between mt-1">
                        <div class="form-text text-muted">如未输入，将尝试使用环境变量配置的 Key</div>
                        <div class="form-text text-success" id="apiKeySaveStatus" style="display: none;">
                            <i class="bi bi-check-circle"></i> 已保存到本地
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <h6>用于生成内容的新闻:</h6>
                    <div id="selectedNewsList" class="border p-2 bg-light">
                        <!-- 选择的新闻列表将通过JavaScript动态加载 -->
                    </div>
                </div>

                <div class="mb-3">
                    <button id="generateContentBtn" class="btn btn-primary">
                        <i class="bi bi-robot"></i> 生成内容
                    </button>
                </div>

                <div class="mb-3">
                    <label class="form-label">生成的内容:</label>
                    <div id="loadingIndicator" class="text-center mb-2" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">生成中...</span>
                        </div>
                        <p class="mt-2">正在生成内容，请稍候...</p>
                    </div>
                    <textarea id="generatedContent" class="form-control" rows="10"></textarea>
                </div>

                <div class="d-flex justify-content-between">
                    <button id="backBtn" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> 返回重新选择
                    </button>

                    <button id="saveContentBtn" class="btn btn-success">
                        <i class="bi bi-check-circle"></i> 保存内容
                    </button>

                    <button id="nextCategoryBtn" class="btn btn-primary">
                        下一个板块 <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 查看/编辑抓取正文弹窗 -->
<div class="modal fade" id="newsContentModal" tabindex="-1" aria-labelledby="newsContentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newsContentModalLabel">查看/编辑抓取内容</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="text-muted small">您可以直接修改下方的抓取内容，保存后将以您输入的内容参与生成。</p>
                <textarea id="scrapedContentTextarea" class="form-control" rows="15"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" id="saveScrapedContentBtn" class="btn btn-primary">保存修改</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/generate.js?v=3"></script>
{% endblock %}
