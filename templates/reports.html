{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <!-- 页面标题 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4><i class="bi bi-folder-check text-primary"></i> 导出文件管理</h4>
        </div>

        <!-- 批量操作工具栏 -->
        <div class="card mb-3" id="batchToolbar" style="display: none;">
            <div class="card-body py-2 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <span class="text-muted small me-3">
                        已选中 <strong id="selectedCount" class="text-primary">0</strong> 项
                    </span>
                </div>
                <button class="btn btn-danger btn-sm" id="batchDeleteBtn">
                    <i class="bi bi-trash"></i> 批量删除
                </button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-primary text-white">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-0">文件总数</h6>
                            <h3 class="mb-0" id="totalCount">0</h3>
                        </div>
                        <i class="bi bi-files display-6 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-0">Word 文档</h6>
                            <h3 class="mb-0" id="wordCount">0</h3>
                        </div>
                        <i class="bi bi-file-earmark-word display-6 opacity-50"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-danger text-white">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-0">PDF 文档</h6>
                            <h3 class="mb-0" id="pdfCount">0</h3>
                        </div>
                        <i class="bi bi-file-earmark-pdf display-6 opacity-50"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 文件列表 -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">文件列表</h5>
                <span class="text-muted small" id="listInfo"></span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 40px;">
                                    <input type="checkbox" class="form-check-input" id="selectAllCheckbox">
                                </th>
                                <th style="width: 50px;">#</th>
                                <th>资讯标题</th>
                                <th style="width: 120px;">格式</th>
                                <th style="width: 100px;">大小</th>
                                <th style="width: 160px;">导出时间</th>
                                <th style="width: 140px;" class="text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="reportsTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">加载中...</span>
                                    </div>
                                    <p class="text-muted mt-2">正在加载文件列表...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center">
                <span class="text-muted small" id="paginationInfo">第 1 页，共 0 页</span>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="pagination">
                        <!-- 分页控件由 JS 生成 -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- 删除确认模态框 -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认删除</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">确定要删除该文件吗？<br><span class="text-danger small">删除后不可恢复</span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-danger btn-sm" id="confirmDeleteBtn">
                    <i class="bi bi-trash"></i> 确认删除
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/reports.js"></script>
{% endblock %}
